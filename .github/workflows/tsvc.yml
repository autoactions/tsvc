name: tsvc
run-name: service:${{ inputs.service }}

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service
        required: true
        type: choice
        options:
          - chrome
          - openlist
          - code-server

permissions: {}

jobs:
  session:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: ${{ inputs.service == 'openlist' && 'tsvc-serialized' || format('tsvc-quick-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Validate closed inputs
        env:
          INPUT_SERVICE: ${{ inputs.service }}
        shell: bash
        run: |
          set -euo pipefail
          case "$INPUT_SERVICE" in
            chrome|openlist|code-server) ;;
            *) echo "Invalid Service" >&2; exit 2 ;;
          esac

      - name: Validate optional Rclone configuration
        env:
          RCLONE_CONFIG_CONFIGURED: ${{ secrets.RCLONE_CONFIG != '' }}
          RCLONE_MOUNTS: ${{ vars.RCLONE_MOUNTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RCLONE_CONFIG_CONFIGURED" != "true" && -n "$RCLONE_MOUNTS" ]]; then
            echo "Incomplete Rclone configuration" >&2
            exit 2
          fi
          if [[ -n "$RCLONE_MOUNTS" ]]; then
            node -e '
              const source = process.argv[1];
              const ids = new Set();
              const lines = source.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
              if (lines.length === 0) process.exit(2);
              for (const line of lines) {
                const separator = line.indexOf("=");
                const id = line.slice(0, separator).trim();
                const remoteSource = line.slice(separator + 1).trim();
                const remoteSeparator = remoteSource.indexOf(":");
                const remote = remoteSource.slice(0, remoteSeparator);
                if (
                  separator < 1 || !/^[a-z0-9][a-z0-9-]{0,62}$/.test(id) || ids.has(id) ||
                  remoteSeparator < 1 || !/^[A-Za-z0-9][A-Za-z0-9._ -]*$/.test(remote) ||
                  /[\u0000-\u001f\u007f]/.test(remoteSource)
                ) process.exit(2);
                ids.add(id);
              }
            ' "$RCLONE_MOUNTS" || { echo "Invalid Rclone Mounts" >&2; exit 2; }
          fi

      - name: Validate database configuration
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          DATABASE_CONFIGURED: ${{ secrets.DATABASE != '' }}
          DATABASE_CA_CONFIGURED: ${{ secrets.DATABASE_CA != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_SERVICE" != "openlist" ]]; then
            exit 0
          fi
          if [[ "$DATABASE_CONFIGURED" != "true" || "$DATABASE_CA_CONFIGURED" != "true" ]]; then
            echo "Incomplete database configuration" >&2
            exit 2
          fi

      - name: Record Session start
        shell: bash
        run: |
          set -euo pipefail
          date +%s > "$RUNNER_TEMP/session-started-epoch"

      # actions/checkout v4.2.2, reviewed 2026-08-21.
      - name: Check out repository implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Acquire pinned cloudflared
        shell: bash
        run: scripts/acquire-cloudflared.sh

      - name: Record immutable runtime identities
        shell: bash
        env:
          INPUT_SERVICE: ${{ inputs.service }}
          RCLONE_CONFIGURED: ${{ vars.RCLONE_MOUNTS != '' }}
        run: |
          set -euo pipefail
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          docker version --format 'Docker server: {{.Server.Version}}'
          "$RUNNER_TEMP/cloudflared" --version
          case "$INPUT_SERVICE" in
            chrome) printf '%s\n' 'Chrome: lscr.io/linuxserver/chrome@sha256:49a019a04b8d38422609d3c586636293417f61886704d516b7d5233cb4bd0b12' ;;
            openlist) printf '%s\n' 'OpenList AIO: openlistteam/openlist@sha256:b4de1e8e07de352a57e8f9eefbe5525c4a6eeef0ae4c74c2a1e68cb71d185fdb' ;;
            code-server) printf '%s\n' 'Code Server: lscr.io/linuxserver/code-server@sha256:212d588e21815316d6525abe8d14bb0114fc2cf0499f08e9e34a1b514b1055b9' ;;
            *) exit 2 ;;
          esac
          if [[ "$RCLONE_CONFIGURED" == "true" ]]; then
            printf '%s\n' 'Rclone: rclone/rclone@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548'
          fi

      - name: Stage database configuration
        if: ${{ inputs.service == 'openlist' }}
        shell: bash
        env:
          DATABASE: ${{ secrets.DATABASE }}
        run: node scripts/stage-database.mjs "$RUNNER_TEMP/database.json"

      - name: Stage database CA
        if: ${{ inputs.service == 'openlist' }}
        shell: bash
        env:
          DATABASE_CA: ${{ secrets.DATABASE_CA }}
        run: node scripts/stage-database-ca.mjs "$RUNNER_TEMP/database-ca.pem"

      - name: Stage Session Credential
        if: ${{ inputs.service == 'chrome' || inputs.service == 'openlist' || inputs.service == 'code-server' }}
        shell: bash
        env:
          SESSION_PASSWORD: ${{ secrets.SESSION_PASSWORD }}
        run: node scripts/stage-credential.mjs "$RUNNER_TEMP/session-credential" "$RUNNER_TEMP/sensitive-facts"

      - name: Stage Rclone configuration
        if: ${{ vars.RCLONE_MOUNTS != '' }}
        shell: bash
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: node scripts/stage-rclone-config.mjs "$RUNNER_TEMP/rclone.conf"

      - name: Stage Rclone mounts
        if: ${{ vars.RCLONE_MOUNTS != '' }}
        shell: bash
        env:
          RCLONE_MOUNTS: ${{ vars.RCLONE_MOUNTS }}
        run: node scripts/stage-rclone-mounts.mjs "$RUNNER_TEMP/rclone-mounts"

      - name: Prepare FUSE for Rclone mounts
        if: ${{ vars.RCLONE_MOUNTS != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -c /dev/fuse ]]
          command -v fusermount3 >/dev/null
          if ! grep -qx 'user_allow_other' /etc/fuse.conf; then
            printf '%s\n' 'user_allow_other' | sudo tee -a /etc/fuse.conf >/dev/null
          fi

      - name: Start Session
        id: session
        shell: bash
        env:
          INPUT_SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          rclone_args=()
          database_args=()
          credential_file="$RUNNER_TEMP/session-credential"
          sensitive_args=(--sensitive-facts-file "$RUNNER_TEMP/sensitive-facts")
          if [[ -f "$RUNNER_TEMP/rclone-mounts" ]]; then
            rclone_args+=(
              --rclone-config-file "$RUNNER_TEMP/rclone.conf"
              --rclone-mounts-file "$RUNNER_TEMP/rclone-mounts"
            )
          fi
          if [[ "$INPUT_SERVICE" == "openlist" ]]; then
            database_args+=(
              --database-file "$RUNNER_TEMP/database.json"
              --database-ca-file "$RUNNER_TEMP/database-ca.pem"
            )
          fi
          locator_file="${GITHUB_WORKSPACE}/session-deck-output.md"
          session_log="$RUNNER_TEMP/session.log"
          : > "$session_log"
          printf '%s\n' \
            '#!/bin/bash' \
            'term() { if [[ -n "${child:-}" ]]; then kill -TERM "$child" 2>/dev/null || true; wait "$child" || true; fi; printf "%s\n" "${1:-1}" > "${RUNNER_TEMP}/session.exit"; exit "${1:-1}"; }' \
            'trap "term 1" TERM INT' \
            'node src/session.mjs "$@" &' \
            'child=$!' \
            'wait "$child"' \
            'status=$?' \
            'trap - TERM INT' \
            'printf "%s\n" "$status" > "${RUNNER_TEMP}/session.exit"' \
            'exit "$status"' \
            > "$RUNNER_TEMP/session-wrapper.sh"
          chmod +x "$RUNNER_TEMP/session-wrapper.sh"
          setsid "$RUNNER_TEMP/session-wrapper.sh" \
            --service "$INPUT_SERVICE" \
            --credential-file "$credential_file" \
            --cloudflared "$RUNNER_TEMP/cloudflared" \
            --started-epoch-file "$RUNNER_TEMP/session-started-epoch" \
            "${sensitive_args[@]}" \
            "${rclone_args[@]}" \
            "${database_args[@]}" \
            >> "$session_log" 2>&1 < /dev/null &
          session_pid=$!
          printf '%s\n' "$session_pid" > "$RUNNER_TEMP/session.pid"
          tail -F "$session_log" &
          tail_pid=$!
          session_handed_off=0
          stop_start() {
            kill "$tail_pid" 2>/dev/null || true
            if [[ "$session_handed_off" != 1 ]]; then
              scripts/reap-session.sh "$session_pid" 0 || true
            fi
          }
          trap stop_start EXIT
          trap 'stop_start; exit 143' INT TERM
          while [[ ! -f "$locator_file" ]]; do
            if ! kill -0 "$session_pid" 2>/dev/null; then
              wait "$session_pid"
              exit $?
            fi
            sleep 1
          done
          session_handed_off=1
          trap - EXIT INT TERM
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

      # actions/upload-artifact v7.0.1, reviewed 2026-08-26.
      - name: Upload Session Deck Locator Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: session-deck-locators
          path: session-deck-output.md
          if-no-files-found: error
          retention-days: 1

      - name: Wait for Session
        if: ${{ steps.session.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          session_pid="$(cat "$RUNNER_TEMP/session.pid")"
          session_log="$RUNNER_TEMP/session.log"
          tail -n +1 -F "$session_log" &
          tail_pid=$!
          interrupt() {
            kill "$tail_pid" 2>/dev/null || true
            scripts/reap-session.sh "$session_pid" 0 || true
            exit 143
          }
          trap interrupt INT TERM
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          while kill -0 "$session_pid" 2>/dev/null; do
            sleep 1
          done
          trap - INT TERM EXIT
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          exit "$(cat "$RUNNER_TEMP/session.exit")"

      - name: Record pre-readiness failure
        if: ${{ failure() && steps.session.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## Session' "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            printf '%s\n' '## Session failed' '' 'Phase: startup' 'Diagnostic: Session startup failed before readiness.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove workflow-owned temporary files
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/session.pid" ]]; then
            scripts/reap-session.sh "$(cat "$RUNNER_TEMP/session.pid")" 5 || true
          fi
          rm -f -- \
            "$RUNNER_TEMP/cloudflared" \
            "$RUNNER_TEMP/cloudflared.log" \
            "$RUNNER_TEMP/cloudflared.log.1" \
            "$RUNNER_TEMP/cloudflared.log.2" \
            "$RUNNER_TEMP/rclone.conf" \
            "$RUNNER_TEMP/rclone-mounts" \
            "$RUNNER_TEMP/session-started-epoch" \
            "$RUNNER_TEMP/session-credential" \
            "$RUNNER_TEMP/sensitive-facts" \
            "$RUNNER_TEMP/database.json" \
            "$RUNNER_TEMP/database-ca.pem" \
            "$RUNNER_TEMP/session.log" \
            "$RUNNER_TEMP/session.pid" \
            "$RUNNER_TEMP/session.exit" \
            "$RUNNER_TEMP/session-wrapper.sh"
